root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
bin = "tmp/main.exe"          # Output binary to tmp/main.exe (Windows-friendly)
cmd = "go build -o tmp/main.exe ./cmd/main.go"  # Build from cmd/main.go
exclude_dir = ["assets", "tmp", "vendor", "testdata"]
exclude_file = []
exclude_regex = ["_test.go"]
include_ext = ["go", "tpl", "tmpl", "html"]
kill_delay = "0s"
log = "build-errors.log"
stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true